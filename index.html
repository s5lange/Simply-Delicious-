
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simply Delicious</title>
<style>
body{margin:0;background:#fff9f4;color:#493a32;font-family:Arial,sans-serif}
header{background:#e9cbbd;padding:30px 18px;text-align:center}
h1{margin:0;font-family:Georgia,serif;font-size:36px}
header p{margin-bottom:0}
main{padding:18px;max-width:700px;margin:auto}
input,textarea,select,button{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;border-radius:12px;border:1px solid #d8c7bd;font-size:16px}
button{background:#a66c58;color:white;border:0;font-weight:bold}
nav{display:flex;gap:7px;overflow-x:auto}
nav button{white-space:nowrap;width:auto;padding:11px}
.card,form{background:white;border-radius:16px;padding:17px;margin:14px 0;box-shadow:0 2px 9px #00000012}
.card h3{margin-top:0}
small{color:#806d62}
pre{white-space:pre-wrap;font-family:Arial,sans-serif;line-height:1.5}
</style>
</head>
<body>
<header>
<h1>Simply Delicious</h1>
<p>My favorite recipes, all in one place ♡</p>
</header>
<main>
<input id="search" placeholder="Search my recipes..." oninput="render()">
<nav id="categories"></nav>
<h2>My Recipe Box</h2>
<div id="recipes"></div>
<h2>Add a Recipe</h2>
<form id="form">
<input id="name" placeholder="Recipe name" required>
<select id="category">
<option>Dinner</option>
<option>Breakfast</option>
<option>Desserts</option>
<option>Lunch</option>
<option>Snacks</option>
<option>Drinks</option>
</select>
<textarea id="ingredients" rows="5" placeholder="Ingredients" required></textarea>
<textarea id="instructions" rows="6" placeholder="Directions" required></textarea>
<input id="link" type="url" placeholder="Recipe video or website link (optional)">
<input id="photo" type="file" accept="image/*">
<button type="submit">Save Recipe ♡</button>
</form>
</main>
<script>
const key="simplyDeliciousRecipes";
const cats=["All","Dinner","Breakfast","Desserts","Lunch","Snacks","Drinks"];
let selected="All";
let recipes=JSON.parse(localStorage.getItem(key)||"[]");
function save(){localStorage.setItem(key,JSON.stringify(recipes))}
function render(){
document.getElementById("categories").innerHTML=cats.map(c=>`<button onclick="selected='${c}';render()">${c}</button>`).join("");
let q=document.getElementById("search").value.toLowerCase();
let filtered=recipes.filter(r=>(selected==="All"||r.category===selected)&&r.name.toLowerCase().includes(q));
let area=document.getElementById("recipes");
area.replaceChildren();
if(!filtered.length)area.textContent="No recipes here yet. Add your first one below!";
filtered.forEach(r=>{
let card=document.createElement("article");card.className="card";
let h=document.createElement("h3");h.textContent=r.name;card.append(h);
if(r.photo){const img=document.createElement("img");img.src=r.photo;img.style.cssText="width:100%;height:auto;border-radius:12px;margin:12px 0";card.append(img);}
let small=document.createElement("small");small.textContent=r.category;card.append(small);
let a=document.createElement("h4");a.textContent="Ingredients";card.append(a);
let ing=document.createElement("pre");ing.textContent=r.ingredients;card.append(ing);
let b=document.createElement("h4");b.textContent="Directions";card.append(b);
let directions=document.createElement("pre");directions.textContent=r.instructions;card.append(directions);
if(r.link){let link=document.createElement("a");link.href=r.link;link.textContent="Open recipe video or website";link.target="_blank";link.rel="noopener noreferrer";card.append(link)}
let editButton = document.createElement("button");
editButton.textContent = "✏️ Edit Recipe";
editButton.type = "button";
editButton.onclick = () => editRecipe(r.name);
card.append(editButton);
let deleteButton = document.createElement("button");
deleteButton.textContent = "Delete Recipe 🗑️";
deleteButton.type = "button";
deleteButton.onclick = () => deleteRecipe(r.name);
card.append(deleteButton);
area.append(card);
});
}
document.getElementById("form").addEventListener("submit",async e=>{
  const photoFile = document.getElementById("photo").files[0];
  const photoData = photoFile ? await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = reject; reader.readAsDataURL(photoFile); }) : "";
e.preventDefault();
const recipeName = document.getElementById("name").value;
const existingIndex = recipes.findIndex(r => r.name === recipeName);
const oldPhoto = existingIndex !== -1 ? recipes[existingIndex].photo : "";
if (existingIndex !== -1) recipes.splice(existingIndex, 1);
recipes.unshift({
name:document.getElementById("name").value,
category:document.getElementById("category").value,
ingredients:document.getElementById("ingredients").value,
instructions:document.getElementById("instructions").value,
link:document.getElementById("link").value,
photo: photoData || oldPhoto
});
save();e.target.reset();selected="All";render();
alert("Recipe saved!");
});
render();
function deleteRecipe(recipeName) {
  const index = recipes.findIndex(r => r.name === recipeName);
  if (index === -1) return;
  if (confirm("Delete this recipe?")) {
    recipes.splice(index, 1);
    save();
    render();
  }
}

function editRecipe(recipeName) {
  const index = recipes.findIndex(r => r.name === recipeName);
  if (index === -1) return;

  const recipe = recipes[index];
  document.getElementById("name").value = recipe.name;
  document.getElementById("category").value = recipe.category;
  document.getElementById("ingredients").value = recipe.ingredients;
  document.getElementById("instructions").value = recipe.instructions;
  document.getElementById("link").value = recipe.link || "";

  
  save();
  render();
  document.getElementById("form").scrollIntoView();
}
  
</script>
</body>
</html>
